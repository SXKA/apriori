[project]
name = "apriori"
version = "0.1.0"
description = "Apriori frequent itemset mining with a hash tree."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
# Scripts, not an installable package.
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
